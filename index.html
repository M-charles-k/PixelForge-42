<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support & Inventory Lookup</title>
  <!-- Replace or include your stylesheet link here -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main style="max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: system-ui, -apple-system, sans-serif;">
    
    <h2>Customer Service Portal</h2>

    <!-- SECTION 1: ORDER LOOKUP -->
    <section style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 24px;">
      <h3>Check Order Status</h3>
      <form id="order-form">
        <div style="margin-bottom: 12px;">
          <label for="order-number" style="display: block; margin-bottom: 6px; font-weight: 500;">Order ID:</label>
          <input type="text" id="order-number" placeholder="e.g., ORD-6001" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
        </div>
        <button type="submit" class="btn" style="background: #0284c7; color: #fff; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;">
          Lookup Order
        </button>
      </form>
      <div id="order-result"></div>
    </section>

    <!-- SECTION 2: STOCK SEARCH -->
    <section style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 24px;">
      <h3>Search Inventory Stock</h3>
      <form id="stock-form">
        <div style="margin-bottom: 12px;">
          <label for="stock-query" style="display: block; margin-bottom: 6px; font-weight: 500;">Product Name or Item ID:</label>
          <input type="text" id="stock-query" placeholder="e.g., Beanie or ITEM1001" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
        </div>
        <button type="submit" class="btn" style="background: #0284c7; color: #fff; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;">
          Search Inventory
        </button>
      </form>
      <div id="stock-result"></div>
    </section>

    <!-- SECTION 3: SUPPORT FALLBACK FORM -->
    <section id="support-fallback-section" style="display: none; background: #fff; border: 2px solid #0d9488; border-radius: 8px; padding: 20px; margin-bottom: 24px;">
      <h3 style="color: #0f766e; margin-top: 0;">Submit a Support Ticket</h3>
      <form id="support-fallback-form">
        <div style="margin-bottom: 12px;">
          <label for="fallback-email" style="display: block; margin-bottom: 6px; font-weight: 500;">Your Email:</label>
          <input type="email" id="fallback-email" required placeholder="name@example.com" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
        </div>
        <div style="margin-bottom: 12px;">
          <label for="fallback-reason" style="display: block; margin-bottom: 6px; font-weight: 500;">Inquiry Reason:</label>
          <input type="text" id="fallback-reason" readonly style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background-color: #f1f5f9;">
        </div>
        <div style="margin-bottom: 12px;">
          <label for="fallback-message" style="display: block; margin-bottom: 6px; font-weight: 500;">Details:</label>
          <textarea id="fallback-message" rows="3" placeholder="Describe your request..." style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px;"></textarea>
        </div>
        <button type="submit" class="btn btn-teal" style="background: #0d9488; color: #fff; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;">
          Submit Ticket
        </button>
      </form>
      <div id="fallback-confirmation" style="display: none;"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
